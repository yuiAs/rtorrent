# docker compose up -d --build
#
# Adjust the ./data and ./config paths below to wherever you want the
# session / watch / download directories and rtorrent.rc to live on the host.

services:
  rtorrent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # rakshasa/libtorrent ref. rtorrent's develop branch tracks libtorrent
        # master (see .github/workflows/unit-tests.yml), so the tagged
        # v0.16.11 release of libtorrent is too old — its public headers
        # don't yet include torrent/runtime/network_config.h.
        # Override with a specific commit hash for reproducible builds.
        LIBTORRENT_REF: master
    image: rtorrent:local
    container_name: rtorrent
    restart: unless-stopped

    # Match the ownership of host-side mounts. Override with PUID/PGID
    # env vars if your host user is something other than 1000:1000.
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Tokyo

    # Host paths -> container paths. Edit the left side as needed.
    volumes:
      - ./config/rtorrent.rc:/config/rtorrent.rc:ro
      - ./data/session:/data/session
      - ./data/watch:/data/watch
      - ./data/download:/data/download

    ports:
      # BitTorrent peer / DHT port. Match network.port_range.set in rtorrent.rc.
      - "6881:6881/tcp"
      - "6881:6881/udp"
      # SCGI / XMLRPC. Bound to localhost on the host because SCGI is
      # unauthenticated — front it with a reverse proxy if you need remote
      # access. Drop the 127.0.0.1: prefix to publish on all interfaces.
      - "127.0.0.1:5000:5000/tcp"

    networks:
      - rtorrent-flood-network

    # rtorrent in system.daemon mode runs in foreground without a TTY,
    # so no stdin_open / tty needed.
    stop_grace_period: 30s

networks:
  rtorrent-flood-network:
    external: true
